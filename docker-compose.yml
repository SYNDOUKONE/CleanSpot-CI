services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      CLEANSPOT_DATABASE_URL: postgresql+psycopg2://cleanspot:cleanspot@db:5432/cleanspot
      CLEANSPOT_S3_ENDPOINT: http://minio:9000
      CLEANSPOT_S3_BUCKET: cleanspot-media
      CLEANSPOT_S3_ACCESS_KEY: cleanspot
      CLEANSPOT_S3_SECRET_KEY: cleanspot-secret
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cleanspot
      POSTGRES_PASSWORD: cleanspot
      POSTGRES_DB: cleanspot
    volumes:
      - cleanspot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanspot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cleanspot
      MINIO_ROOT_PASSWORD: cleanspot-secret
    volumes:
      - cleanspot-media:/data
    ports:
      - "9001:9001"
    restart: unless-stopped

volumes:
  cleanspot-db:
  cleanspot-media:
