# Configuration d'entraînement YOLO (détection)
# Utilisée par notebooks/03_object_detection.ipynb

model: yolov8n.pt
data: datasets/taco/yolo_cleanspot/dataset.yaml
epochs: 100
imgsz: 640
batch: 16
seed: 42
device: auto

# Augmentation orientée téléphones bas de gamme et rues ivoiriennes
mosaic: 1.0
hsv_h: 0.015
hsv_s: 0.8
hsv_v: 0.5
degrees: 5
translate: 0.1
scale: 0.5
flipud: 0.0
fliplr: 0.5
